<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GhostVault | Zero-Trust Authentication</title>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161e2e; padding: 40px; border-radius: 12px; border: 1px solid #1f293d; box-shadow: 0 10px 25px rgba(0,0,0,0.6); text-align: center; width: 340px; }
        h2 { color: #38bdf8; margin-bottom: 8px; font-size: 24px; }
        p { font-size: 13px; color: #94a3b8; }
        .qr-box { background: white; padding: 12px; border-radius: 8px; display: inline-block; margin: 15px 0; }
        input { width: 100%; padding: 12px; box-sizing: border-box; background: #0b0f19; border: 1px solid #334155; color: #38bdf8; font-size: 18px; text-align: center; border-radius: 6px; letter-spacing: 4px; font-weight: bold; }
        button { width: 100%; margin-top: 15px; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .hint { font-size: 11px; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>GHOST VAULT</h2>
        <p>Zero-Trust Anti-Forensics Portal</p>
        
        <div class="qr-box">
            <img src="data:image/png;base64,{{ qr_code }}" width="180" height="180" alt="MFA QR Code">
        </div>

        <form action="/verify" method="POST">
            <input type="text" name="code" placeholder="000000" maxlength="6" required autocomplete="off">
            <button type="submit">AUTHENTICATE</button>
        </form>

        <div class="hint">Scan QR with Google Authenticator.<br>Enter <b>999999</b> to trigger Self-Destruct protocol.</div>
    </div>
</body>
</html>
